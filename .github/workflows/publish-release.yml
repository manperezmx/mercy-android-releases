          def list_assets(release_id):
              assets = api("GET", PREFIX + "/releases/" + str(release_id) + "/assets?per_page=100")
              require(isinstance(assets, list) and len(assets) < 100,
                      "Unexpected release asset count; no asset will be deleted")
              names = [item.get("name") for item in assets]
              require(len(set(names)) == len(names) and set(names).issubset(EXPECTED),
                      "Unexpected or duplicate release assets; no asset will be deleted")
              return {item["name"]: item for item in assets}


          def verify_asset(item, expected, *, draft=False):
              name = item.get("name")
              require(isinstance(name, str) and name in EXPECTED and EXPECTED[name] == expected,
                      "Release asset filename differs from exact pinned inputs; no replacement performed")
              url = item.get("browser_download_url")
              valid_url = isinstance(url, str) and url == PUBLIC_BASE + name
              if draft and isinstance(url, str):
                  # GitHub assigns untagged URLs until publishing a draft. Validate the complete
                  # literal URL, not only urlsplit fields (which may strip control characters).
                  draft_pattern = (r"https://github\.com/" + re.escape(REPOSITORY) +
                                   r"/releases/download/untagged-[A-Za-z0-9-]{1,80}/" + re.escape(name))
                  valid_url = valid_url or re.fullmatch(draft_pattern, url) is not None
              require(item.get("state") == "uploaded" and item.get("size") == expected["bytes"] and
                      item.get("digest") == "sha256:" + expected["sha256"] and
                      item.get("content_type") == expected["mime"] and valid_url,
                      "Uploaded release asset metadata differs from exact pinned inputs; no replacement performed")


          def verify_tag(target, must_exist=False):
              require(re.fullmatch(r"[a-f0-9]{40}", target or "") is not None,
                      "Release target is not an exact repository commit")
              tag = api("GET", PREFIX + "/git/ref/tags/" + TAG, missing_ok=True)
              require(tag is not None or not must_exist, "Published release tag is missing")
              if tag:
                  require(tag.get("object", {}).get("type") == "commit" and
                          tag["object"].get("sha") == target,
                          "Release tag targets another commit; no tag alteration performed")


          def verify_main_target():
              branch = api("GET", PREFIX + "/git/ref/heads/main")
              require(branch.get("object", {}).get("type") == "commit" and
                      branch["object"].get("sha") == JOB_SHA,
                      "Main changed during this run; no release mutation is permitted")


          def verified_published_release(release, tools, directory):
              require(release.get("tag_name") == TAG and release.get("draft") is False and
                      release.get("prerelease") is False and release.get("immutable") is True and
                      release.get("target_commitish") == RELEASE_TARGET_SHA,
                      "Release is not published and immutable as required")
              verify_tag(RELEASE_TARGET_SHA, must_exist=True)
              assets = list_assets(release["id"])
              require(set(assets) == set(EXPECTED), "Published release lacks exact expected assets")
              for name, item in assets.items():
                  verify_asset(item, EXPECTED[name])
                  path = directory / ("public-" + name)
                  pinned_download(PUBLIC_BASE + name, EXPECTED[name]["bytes"], EXPECTED[name]["sha256"],
                                  path, attachment=name.endswith(".apk"))
                  if name.endswith(".apk"):
                      metadata = next(entry for entry in MANIFEST["releases"] if entry["filename"] == name)
                      verify_apk(path, metadata, tools)
              print("Published immutable release and all public downloads verified:")
              print("https://github.com/" + REPOSITORY + "/releases/tag/" + TAG)
              print(PUBLIC_BASE + "Mercy-Android-0.18.0.apk")


          def publish():
              repository = api("GET", PREFIX)
              require(repository.get("full_name") == REPOSITORY and repository.get("private") is False and
                      repository.get("default_branch") == "main", "Unexpected release repository")
              for target in dict.fromkeys((JOB_SHA, RELEASE_TARGET_SHA)):
                  commit = api("GET", PREFIX + "/commits/" + target)
                  require(commit.get("sha") == target, "Workflow or release SHA is not a commit in the release repository")
              tools = sdk_tools()
              with tempfile.TemporaryDirectory(prefix="mercy-publication-") as temporary:
                  directory = Path(temporary)
                  published = api("GET", PREFIX + "/releases/tags/" + TAG, missing_ok=True)
                  if published and not published.get("draft"):
                      verified_published_release(published, tools, directory)
                      print("Exact release already exists; no mutation performed.")
                      return
                  # List authenticated releases because tag lookup does not guarantee draft visibility.
                  releases = api("GET", PREFIX + "/releases?per_page=100")
                  require(isinstance(releases, list) and len(releases) < 100,
                          "Unexpected release listing; publication stopped")
                  matches = [item for item in releases if item.get("tag_name") == TAG]
                  require(len(matches) <= 1, "Multiple release drafts found; publication stopped")
                  draft = matches[0] if matches else None
                  if draft and not draft.get("draft"):
                      verified_published_release(draft, tools, directory)
                      print("Exact release already exists; no mutation performed.")
                      return
                  if draft:
                      require(draft.get("target_commitish") == RELEASE_TARGET_SHA and draft.get("prerelease") is False and
                              draft.get("name") == "Mercy Android 0.18.0" and draft.get("body") == NOTES,
                              "Existing draft has a different target or release notes; no alteration performed")
                      for name, item in list_assets(draft["id"]).items():
                          verify_asset(item, EXPECTED[name], draft=True)
                  verify_tag(RELEASE_TARGET_SHA)
                  verify_main_target()
                  # Obtain only the already-public installer files; verify all ten chunks first.
                  current = MANIFEST["releases"][0]
                  output = directory / current["filename"]
                  with output.open("xb") as complete:
                      for index, part in enumerate(PARTS, start=1):
                          require(part["path"] == "/release-installers/android/0.18.0/part" +
                                  str(index).zfill(4) + ".bin", "Unexpected pinned chunk path")
                          path = directory / ("part" + str(index))
                          pinned_download(SOURCE_ORIGIN + part["path"], part["bytes"], part["sha256"], path)
                          complete.write(path.read_bytes())
                          path.unlink()
                  for previous in MANIFEST["releases"][1:]:
                      pinned_download(SOURCE_ORIGIN + "/downloads/" + previous["filename"],
                                      previous["bytes"], previous["sha256"],
                                      directory / previous["filename"])
                  for release in MANIFEST["releases"]:
                      verify_apk(directory / release["filename"], release, tools)
                  (directory / "SHA256SUMS.txt").write_bytes(checksums_bytes)
                  (directory / "release-manifest.json").write_bytes(manifest_bytes)
                  if draft is None:
                      verify_main_target()
                      verify_tag(RELEASE_TARGET_SHA)
                      draft = api("POST", PREFIX + "/releases", {
                          "tag_name": TAG, "target_commitish": RELEASE_TARGET_SHA, "name": "Mercy Android 0.18.0",
                          "body": NOTES, "draft": True, "prerelease": False, "generate_release_notes": False})
                  require(draft.get("draft") is True and draft.get("tag_name") == TAG,
                          "GitHub did not create the expected draft")
                  upload_base = draft.get("upload_url", "").split("{", 1)[0]
                  require(upload_base == "https://uploads.github.com/repos/" + REPOSITORY +
                          "/releases/" + str(draft["id"]) + "/assets", "Unexpected GitHub upload endpoint")
                  assets = list_assets(draft["id"])
                  for name, expected in EXPECTED.items():
                      if name in assets:
                          verify_asset(assets[name], expected, draft=True)
                          continue
                      body = (directory / name).read_bytes()
                      require(len(body) == expected["bytes"] and hashlib.sha256(body).hexdigest() == expected["sha256"],
                              "Local upload source changed after verification")
                      item = api("POST", upload_base + "?" + urllib.parse.urlencode({"name": name}),
                                 (body, expected["mime"]), upload=True)
                      require(item.get("name") == name, "Upload returned an unexpected filename")
                      verify_asset(item, expected, draft=True)
                      print("Verified uploaded asset:", name, expected["bytes"], expected["sha256"])
                  assets = list_assets(draft["id"])
                  require(set(assets) == set(EXPECTED), "Draft does not contain every exact approved asset")
                  for name, item in assets.items():
                      verify_asset(item, EXPECTED[name], draft=True)
                  # Only now publish. Root already enabled immutable releases by the authorized UI.
                  verify_main_target()
                  verify_tag(RELEASE_TARGET_SHA)
                  result = api("PATCH", PREFIX + "/releases/" + str(draft["id"]),
                               {"draft": False, "make_latest": "true"})
                  verified_published_release(result, tools, directory)
                  summary = os.environ.get("GITHUB_STEP_SUMMARY")
                  if summary:
                      with open(summary, "a", encoding="utf-8") as report:
                          report.write("Release inmutable y descarga pública completa verificadas.\n\n")
                          for release in MANIFEST["releases"]:
                              report.write("- [" + release["filename"] + "](" + PUBLIC_BASE + release["filename"] +
                                           "): " + str(release["bytes"]) + " bytes; SHA-256 `" + release["sha256"] + "`.\n")
                          report.write("\nFirma original, paquete y versiones comprobados. Pruebas en teléfonos reales e identidad/PAD pendientes.\n")

          try:
              publish()
          except Failure as error:
              print("Publication stopped:", str(error), file=sys.stderr)
              sys.exit(1)
          except Exception:
              # No traceback may disclose authentication headers or an upload endpoint.
              print("Publication stopped: unexpected verification error; no files were deleted or replaced.",
                    file=sys.stderr)
              sys.exit(1)
          PY_RELEASE
