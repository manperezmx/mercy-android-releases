# Install only this file as .github/workflows/publish-release.yml in the public
# manperezmx/mercy-android-releases repository. It is not a source-app build.
name: Publish exact Mercy Android 0.18.0 installers

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-release.yml]
  workflow_dispatch:

permissions:
