          - 0.18.0: 40,497,952 bytes; paquete mx.mercy.preview, código 18.
          - Historial conservado: 0.17.0 a 0.3.0, excepto 0.12.0 que no existe en el archivo previo. Son 15 APK en total, incluido 0.18.0; todos conservan el paquete y certificado original.
