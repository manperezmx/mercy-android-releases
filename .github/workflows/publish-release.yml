          - 0.18.0 conserva arm64-v8a, armeabi-v7a, x86 y x86_64, así como los modelos locales de calidad facial y OCR. El cambio de 84 MB a 40.5 MB corresponde a compresión ZIP de bibliotecas nativas; se requiere espacio de extracción al instalar.
          - El análisis de calidad facial/OCR no constituye comparación de identidad ni detección de ataques de presentación (PAD). Estas capacidades y las pruebas en teléfonos reales siguen pendientes.
          - Las comprobaciones automáticas de integridad/firma no sustituyen pruebas reales de cámara, GPS en segundo plano, burbuja, notificaciones y conexión del repartidor.
          - El APK 0.17.0 se conserva como referencia y respaldo. Android no permite instalar directamente un código 17 sobre un código 18; una reversión sin desinstalar requiere un nuevo APK con código superior y la firma original.

          SHA256SUMS.txt y release-manifest.json contienen los tamaños, huellas y certificado para comprobar las descargas. El código original del servicio, la llave de firma, los accesos y los documentos privados no se publican en este repositorio.
          """

          # No user input, checkout, external actions, signing key or custom secret is used.
          # GitHub's token is used only for api.github.com / the verified upload endpoint.
          class Failure(Exception):
              pass

          def require(condition, message):
              if not condition:
                  raise Failure(message)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, newurl):
                  raise Failure("GitHub authenticated API unexpectedly requested a redirect")

          class PublicHTTPSRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, newurl):
                  parsed = urllib.parse.urlsplit(newurl)
                  require(parsed.scheme == "https" and parsed.hostname and
                          not parsed.username and not parsed.password,
                          "Public file download attempted an unsafe redirect")
                  return super().redirect_request(request, fp, code, message, headers, newurl)

          AUTH_OPENER = urllib.request.build_opener(NoRedirect)
          PUBLIC_OPENER = urllib.request.build_opener(PublicHTTPSRedirect)
          TOKEN = os.environ.get("GITHUB_TOKEN", "")
          JOB_SHA = os.environ.get("GITHUB_SHA", "")
          require(os.environ.get("GITHUB_REPOSITORY") == REPOSITORY,
                  "Workflow must run in the authorized release repository")
          require(os.environ.get("GITHUB_REF") == "refs/heads/main",
                  "Workflow must run only from main")
          require(os.environ.get("GITHUB_EVENT_NAME") in ("push", "workflow_dispatch"),
                  "Unexpected workflow trigger")
          require(re.fullmatch(r"[a-f0-9]{40}", JOB_SHA) is not None and TOKEN,
                  "GitHub runtime commit or token is missing")


          def api(method, path, payload=None, missing_ok=False, upload=False):
              if upload:
                  parsed = urllib.parse.urlsplit(path)
                  require(parsed.scheme == "https" and parsed.netloc == "uploads.github.com" and
                          not parsed.username and not parsed.password and not parsed.fragment and
                          re.fullmatch(r"/repos/manperezmx/mercy-android-releases/releases/[0-9]+/assets",
                                       parsed.path), "Unexpected release upload endpoint")
                  url = path
                  body, content_type = payload
              else:
                  require(path.startswith("/repos/" + REPOSITORY + "/") or
                          path == "/repos/" + REPOSITORY, "Unexpected GitHub API repository")
                  url = API_ORIGIN + path
                  body = None if payload is None else json.dumps(payload).encode("utf-8")
                  content_type = "application/json"
              headers = {"Accept": "application/vnd.github+json", "Content-Type": content_type,
                         "Authorization": "Bearer " + TOKEN, "X-GitHub-Api-Version": "2026-03-10",
                         "User-Agent": "Mercy-pinned-installer-publication"}
              request = urllib.request.Request(url, data=body, method=method, headers=headers)
              try:
                  with AUTH_OPENER.open(request, timeout=90) as response:
                      raw = response.read(8 * 1024 * 1024 + 1)
                      require(len(raw) <= 8 * 1024 * 1024, "Unexpectedly large GitHub API response")
                      return json.loads(raw)
              except urllib.error.HTTPError as error:
                  if error.code == 404 and missing_ok:
                      return None
                  # Deliberately do not print response bodies, headers or upload URLs.
                  raise Failure("GitHub API " + method + " returned HTTP " + str(error.code)) from None
              except (urllib.error.URLError, TimeoutError):
                  raise Failure("GitHub API request failed before completion") from None


          def pinned_download(url, size, digest, target, attachment=False):
              parsed = urllib.parse.urlsplit(url)
              require(parsed.scheme == "https" and parsed.hostname and not parsed.username and
                      not parsed.password and not parsed.query and not parsed.fragment,
                      "Unexpected public source URL")
              checksum = hashlib.sha256()
              total = 0
              request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 MercyVerifier",
                                                            "Accept-Encoding": "identity"})
              try:
                  with PUBLIC_OPENER.open(request, timeout=60) as response, target.open("xb") as output:
                      require(response.status == 200, "Public source did not return a complete file")
                      require(response.headers.get("Content-Length") == str(size),
                              "Public source Content-Length differs from the pinned file")
                      require(response.headers.get("Content-Encoding", "identity") == "identity",
                              "Unexpected HTTP encoding for pinned installer bytes")
                      if attachment:
                          require(response.headers.get_content_type() in
                                  ("application/octet-stream", "application/vnd.android.package-archive"),
                                  "Public installer has an unexpected content type")
                          require(response.headers.get("Content-Disposition", "").lower().startswith("attachment"),
                                  "Public installer endpoint must download an attachment")
                      while block := response.read(1024 * 1024):
                          total += len(block)
                          require(total <= size, "Public source exceeds pinned size")
                          checksum.update(block)
                          output.write(block)
              except urllib.error.HTTPError as error:
                  raise Failure("Public file download returned HTTP " + str(error.code)) from None
              except (urllib.error.URLError, TimeoutError):
                  raise Failure("Public file download failed before completion") from None
              require(total == size and checksum.hexdigest() == digest,
                      "Public source length or SHA-256 does not match the pinned file")


          def sdk_tools():
              # Ubuntu 24.04's official GitHub runner image already contains SDK 35.0.0.
              # Fail closed if that fixed directory disappears; do not download software.
              sdk = Path("/usr/local/lib/android/sdk").resolve()
              configured = os.environ.get("ANDROID_HOME", str(sdk))
              require(Path(configured).resolve() == sdk, "Unexpected Android SDK location")
              build = sdk / "build-tools" / "35.0.0"
              tools = [build / "apksigner", build / "aapt"]
              require(all(tool.is_file() and os.access(tool, os.X_OK) for tool in tools),
                      "Official preinstalled Android Build Tools 35.0.0 are unavailable")
              return tools


          def verify_apk(path, release, tools):
              data = path.read_bytes()
              require(len(data) == release["bytes"] and hashlib.sha256(data).hexdigest() == release["sha256"],
                      "Final APK length or SHA-256 mismatch")
              with zipfile.ZipFile(path) as archive:
                  require(archive.testzip() is None, "APK ZIP integrity failed")
                  if release["version"] == "0.18.0":
                      abis = {name.split("/")[1] for name in archive.namelist()
                              if name.startswith("lib/") and name.endswith(".so")}
                      require(abis == {"arm64-v8a", "armeabi-v7a", "x86", "x86_64"},
                              "Preserved Android CPU compatibility does not match")
              clean_environment = {key: value for key, value in os.environ.items() if key != "GITHUB_TOKEN"}
              try:
                  signed = subprocess.run([str(tools[0]), "verify", "--verbose", "--print-certs", str(path)],
                                          check=True, capture_output=True, text=True, timeout=60,
                                          env=clean_environment).stdout
                  badging = subprocess.run([str(tools[1]), "dump", "badging", str(path)],
                                           check=True, capture_output=True, text=True, timeout=60,
                                           env=clean_environment).stdout
              except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
                  raise Failure("Android SDK signature or manifest verification failed") from None
              signers = re.findall(r"Signer #\d+ certificate SHA-256 digest: ([a-f0-9]+)", signed)
              require(signers == [CERTIFICATE], "APK signer differs from Mercy's permanent signer")
              package = re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'",
                                  badging, re.MULTILINE)
              require(package and package.groups() == (release["package"], str(release["version_code"]),
                                                      release["version"]), "APK package or version mismatch")
              sdk = re.search(r"^sdkVersion:'([^']+)'", badging, re.MULTILINE)
              require(sdk and sdk.group(1) == str(release["minimum_android_api"]),
                      "APK minimum Android compatibility mismatch")
              print("Verified APK:", release["filename"], release["bytes"], release["sha256"])


          manifest_bytes = (json.dumps(MANIFEST, indent=2, ensure_ascii=False) + "\n").encode("utf-8")
          checksums_bytes = ("".join(item["sha256"] + "  " + item["filename"] + "\n"
                                   for item in MANIFEST["releases"])).encode("ascii")
          EXPECTED = {item["filename"]: {"bytes": item["bytes"], "sha256": item["sha256"],
                                        "mime": "application/vnd.android.package-archive"}
                      for item in MANIFEST["releases"]}
          for name, contents, mime in (("SHA256SUMS.txt", checksums_bytes, "text/plain"),
                                       ("release-manifest.json", manifest_bytes, "application/json")):
              EXPECTED[name] = {"bytes": len(contents), "sha256": hashlib.sha256(contents).hexdigest(), "mime": mime}
          PREFIX = "/repos/" + REPOSITORY
